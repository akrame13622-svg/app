name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python@v4
      with:
        python-version: '3.11'

    - name: Install Flet CLI & Flutter
      run: |
        python -m pip install --upgrade pip
        pip install flet[all]==0.22.0

    - name: Build APK
      run: |
        flet build apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: todo-app-apk
        path: build/apk/*.apk
